[build]
  publish = "."
  functions = "netlify/functions"
  # Static single-file — no build step

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/NEXUS-EYE.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# v0.3.8.1: home-screen icon + PWA manifest
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-master.svg"
  [headers.values]
    Content-Type = "image/svg+xml"
    Cache-Control = "public, max-age=86400"

# v0.4.0: self-hosted satellite.js 5.0.0 (versioned file name → long cache is safe)
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Modern function uses export const config.path = "/api/air"
# Keep redirect as belt-and-suspenders for /.netlify/functions/air callers
[[redirects]]
  from = "/api/air"
  to = "/.netlify/functions/air"
  status = 200

# v0.3.8: /api/cam — allowlisted TxDOT ITS snapshot decoder (not an open proxy)
[[redirects]]
  from = "/api/cam"
  to = "/.netlify/functions/cam"
  status = 200

# v0.4.7: /api/fire — NASA FIRMS MODIS C6.1 active-fire CSV proxy (keyless)
[[redirects]]
  from = "/api/fire"
  to = "/.netlify/functions/fire"
  status = 200

# v0.4.8: /api/volc — USGS HANS volcano alert levels + GVP Holocene catalog proxy (keyless)
[[redirects]]
  from = "/api/volc"
  to = "/.netlify/functions/volc"
  status = 200

# v0.4.10: /api/buoy — NOAA NDBC latest marine observations proxy (keyless; NDBC sends no CORS header)
[[redirects]]
  from = "/api/buoy"
  to = "/.netlify/functions/buoy"
  status = 200

[[redirects]]
  from = "/eye"
  to = "/index.html"
  status = 200
